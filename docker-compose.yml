x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.10.2-python3.11}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__ENABLE_XCOM_PICKLING: 'false'
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
    AIRFLOW__WEBSERVER__RBAC: 'true'
    PYTHONPATH: /opt/airflow
    _PIP_ADDITIONAL_REQUIREMENTS: 'pandera[pandas]==0.20.4 requests psycopg2-binary pydantic httpx openai numpy scipy'
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    AI_MODEL_NAME: ${AI_MODEL_NAME:-gemini-1.5-flash}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/include:/opt/airflow/include
    - ./airflow/logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - sismowatch-net

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Schemas: raw and curated)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: sismowatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sismowatch-net

  # ----------------------------------------------------------------------------
  # Airflow Init (Runs db migrate and creates initial Admin user)
  # ----------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: sismowatch-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/include
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-sismowatch_admin}" \
          --firstname SismoWatch \
          --lastname Admin \
          --role Admin \
          --email devops@sismowatch.internal \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-AirflowAdmin2026!Secure}" || true
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Airflow Webserver
  # ----------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: sismowatch-airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------------------------
  # Airflow Scheduler
  # ----------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: sismowatch-airflow-scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------------------------
  # FastAPI Backend (Protected REST + SSE Endpoints)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sismowatch-api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_DB_USER: ${API_DB_USER:-sismowatch_api}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-sismowatch_api_secret_2026}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      VIEWER_USERNAME: ${VIEWER_USERNAME:-viewer}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-viewer123}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-sismowatch_admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-AirflowAdmin2026!Secure}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-gemini-1.5-flash}
    volumes:
      - ./api:/app
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sismowatch-net

  # ----------------------------------------------------------------------------
  # Web Platform (React + Vite + TypeScript + Leaflet)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_CARTO_API_KEY: ${VITE_CARTO_API_KEY:-}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: sismowatch-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sismowatch-net

volumes:
  postgres-data:
    driver: local

networks:
  sismowatch-net:
    driver: bridge
